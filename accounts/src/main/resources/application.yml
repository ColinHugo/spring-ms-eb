server:
  port: 8080

spring:

  profiles:
    active: "prod"

  application:
    name: accounts

  datasource:
    # url: jdbc:mysql://localhost:3306/accountsdb
    # username: root
    # password: root
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true

  jpa:
    show-sql: true

  # Ejecuta los queries que estén en resources/schema.sql siempre y cuando no sea H2, con H2 es automático
#  sql:
#    init:
#      mode: always

  config:
    import: "optional:configserver:http://localhost:8071/"

#  rabbitmq:
#    host: "localhost"
#    port: 5672
#    username: "guest"
#    password: "guest"

# Exponer endpoints de actuator, se expone un endpoint que permite la actualización de properties en runtime
# http://localhost:8080/actuator/refresh - POST
management:
  endpoints:
    web:
      exposure:
        include: "*"
  # management.endpoint.shutdown.enabled=true está deprecado
  # http://localhost:8080/actuator/shutdown (POST) Apaga el servicio
  endpoint:
    shutdown:
      access: unrestricted
  info:
    env:
      enabled: true

# Ya no es requerido, se puede ignorar
# endpoints:
#  shutdown:
#    enabled: true

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: "http://localhost:8070/eureka/"

# http://localhost:8080/actuator/info
info:
  app:
    name: "accounts"
    description: "Eazy Bank Accounts Application"
    version: "1.0.0"