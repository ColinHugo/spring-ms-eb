spring:
  application:
    name: "eurekaserver"
  config:
    import: "optional:configserver:http://localhost:8071/"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true

# http://localhost:8070/eureka/apps
# http://localhost:8070/eureka/apps/nombreServicio

logging:
  level:
    com:
      eazybytes:
        eurekaserver: DEBUG